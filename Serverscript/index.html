<!DOCTYPE html>
<html>
<head>
    <title>Web Server Information</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f4f4f4;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Web Server Information</h2>

    <p>Enter Website URL or Server IP:</p>

    <input type="text" id="target"
           placeholder="example.com or 192.168.1.10">

    <button onclick="getInfo()">Check</button>

    <div id="result">
        Server information will appear here.
    </div>

</div>

<script>

function getInfo() {

    let target = document.getElementById("target").value;

    if (target.trim() === "") {
        alert("Please enter a URL or IP address");
        return;
    }

    document.getElementById("result").innerHTML =
        "Checking server...";

    fetch("serverinfo.php?target=" + encodeURIComponent(target))
        .then(response => response.text())
        .then(data => {
            document.getElementById("result").innerHTML = data;
        })
        .catch(error => {
            document.getElementById("result").innerHTML =
                "Error connecting to server.";
        });
}

</script>

</body>
</html>
